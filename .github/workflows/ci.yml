name: CI

# Runs on every push and pull request. Render deploys main only after this passes
# (render.yaml: autoDeployTrigger: checksPass).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w @enticra/web
